<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2500" viewBox="0 0 1500 2500" role="img" aria-labelledby="title description">
  <title id="title">iBIM Insurance Mutual platform diagrams</title>
  <desc id="description">Platform architecture, source-of-truth data model, workflow, use cases and swimlane.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#18324b"/></marker>
    <style>
      .panel{fill:#f7f9fb;stroke:#b8c8d6;stroke-width:2}.title{font:700 26px Georgia,serif;fill:#102a43}.label{font:600 15px Arial,sans-serif;fill:#18324b}.small{font:14px Arial,sans-serif;fill:#29465f}.box{fill:#fff;stroke:#47718f;stroke-width:2;rx:8}.actor{fill:#f0c36a;stroke:#a87819;stroke-width:2}.service{fill:#d9eee8;stroke:#35766c;stroke-width:2}.data{fill:#e5eaf4;stroke:#52678d;stroke-width:2}.state{fill:#fff2d6;stroke:#b27b20;stroke-width:2;rx:18}.line{stroke:#18324b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dashed{stroke:#527089;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="2500" fill="#fff"/>
  <text x="70" y="55" class="title" font-size="34">iBIM Insurance Mutual Platform</text>
  <text x="70" y="85" class="small">Single Master Record, governed workflows and post-bind reporting</text>

  <rect x="50" y="115" width="1400" height="390" class="panel"/><text x="80" y="155" class="title">1. Platform architecture</text>
  <rect x="85" y="205" width="210" height="70" class="actor"/><text x="190" y="235" text-anchor="middle" class="label">Client and member</text><text x="190" y="258" text-anchor="middle" class="small">Secure web forms</text>
  <rect x="85" y="345" width="210" height="70" class="actor"/><text x="190" y="375" text-anchor="middle" class="label">Broker team</text><text x="190" y="398" text-anchor="middle" class="small">Handlers and finance</text>
  <rect x="360" y="210" width="250" height="200" class="service"/><text x="485" y="245" text-anchor="middle" class="label">iBIM web application</text><text x="485" y="285" text-anchor="middle" class="small">Master record workspace</text><text x="485" y="315" text-anchor="middle" class="small">Digital forms and queues</text><text x="485" y="345" text-anchor="middle" class="small">Dashboards and exports</text><text x="485" y="375" text-anchor="middle" class="small">Role-aware navigation</text>
  <rect x="675" y="210" width="280" height="200" class="service"/><text x="815" y="245" text-anchor="middle" class="label">Application services</text><text x="815" y="285" text-anchor="middle" class="small">Validation and workflow</text><text x="815" y="315" text-anchor="middle" class="small">Renewal automation</text><text x="815" y="345" text-anchor="middle" class="small">Rating and policy binding</text><text x="815" y="375" text-anchor="middle" class="small">Audit and permissions</text>
  <rect x="1020" y="200" width="300" height="80" class="data"/><text x="1170" y="232" text-anchor="middle" class="label">PostgreSQL / Prisma</text><text x="1170" y="257" text-anchor="middle" class="small">Master record and audit history</text>
  <rect x="1020" y="340" width="300" height="80" class="data"/><text x="1170" y="372" text-anchor="middle" class="label">Reports and documents</text><text x="1170" y="397" text-anchor="middle" class="small">Bordereaux, finance and board packs</text>
  <path d="M295 240 H360" class="line"/><path d="M295 380 H360" class="line"/><path d="M610 310 H675" class="line"/><path d="M955 240 H1020" class="line"/><path d="M955 380 H1020" class="line"/>

  <rect x="50" y="535" width="1400" height="480" class="panel"/><text x="80" y="575" class="title">2. Master Record data model</text>
  <rect x="585" y="650" width="330" height="130" class="service"/><text x="750" y="685" text-anchor="middle" class="label">MASTER RECORD</text><text x="750" y="715" text-anchor="middle" class="small">Member, company, contacts</text><text x="750" y="740" text-anchor="middle" class="small">Current policy and source history</text><text x="750" y="765" text-anchor="middle" class="small">Single source of truth</text>
  <rect x="100" y="615" width="250" height="75" class="data"/><text x="225" y="647" text-anchor="middle" class="label">Member / company</text><text x="225" y="670" text-anchor="middle" class="small">identity and contacts</text>
  <rect x="100" y="810" width="250" height="75" class="data"/><text x="225" y="842" text-anchor="middle" class="label">Prospect / enquiry</text><text x="225" y="865" text-anchor="middle" class="small">source and renewal date</text>
  <rect x="1150" y="615" width="250" height="75" class="data"/><text x="1275" y="647" text-anchor="middle" class="label">Proposal / renewal</text><text x="1275" y="670" text-anchor="middle" class="small">versions and decisions</text>
  <rect x="1150" y="810" width="250" height="75" class="data"/><text x="1275" y="842" text-anchor="middle" class="label">Policy / coverage</text><text x="1275" y="865" text-anchor="middle" class="small">bound policy lifecycle</text>
  <rect x="585" y="875" width="330" height="75" class="data"/><text x="750" y="907" text-anchor="middle" class="label">Payments and finance</text><text x="750" y="930" text-anchor="middle" class="small">premium, commission, documents</text>
  <path d="M350 652 H585" class="line"/><path d="M350 847 H585" class="line"/><path d="M915 652 H1150" class="line"/><path d="M915 847 H1150" class="line"/><path d="M750 780 V875" class="line"/>
  <path d="M1275 690 V810" class="dashed"/><text x="1070" y="750" class="small">bind / renew</text>
  <text x="80" y="985" class="small">Linked outputs: Bordereaux, New Business register, Renewals register, rebates reporting, dashboards and audit.</text>

  <rect x="50" y="1045" width="1400" height="390" class="panel"/><text x="80" y="1085" class="title">3. End-to-end workflow</text>
  <rect x="90" y="1160" width="180" height="65" class="actor"/><text x="180" y="1190" text-anchor="middle" class="label">Prospect list</text><text x="180" y="1212" text-anchor="middle" class="small">or website enquiry</text>
  <rect x="330" y="1160" width="180" height="65" class="box"/><text x="420" y="1190" text-anchor="middle" class="label">Digital proposal</text><text x="420" y="1212" text-anchor="middle" class="small">validated web form</text>
  <rect x="570" y="1160" width="180" height="65" class="box"/><text x="660" y="1190" text-anchor="middle" class="label">Review and rate</text><text x="660" y="1212" text-anchor="middle" class="small">underwriting queue</text>
  <rect x="810" y="1160" width="180" height="65" class="box"/><text x="900" y="1190" text-anchor="middle" class="label">Quote / Acturis</text><text x="900" y="1212" text-anchor="middle" class="small">prepared and sent</text>
  <rect x="1050" y="1160" width="180" height="65" class="service"/><text x="1140" y="1190" text-anchor="middle" class="label">Accepted and bound</text><text x="1140" y="1212" text-anchor="middle" class="small">policy and ledger</text>
  <rect x="1290" y="1160" width="110" height="65" class="data"/><text x="1345" y="1190" text-anchor="middle" class="label">Reports</text><text x="1345" y="1212" text-anchor="middle" class="small">outputs</text>
  <path d="M270 1192 H330" class="line"/><path d="M510 1192 H570" class="line"/><path d="M750 1192 H810" class="line"/><path d="M990 1192 H1050" class="line"/><path d="M1230 1192 H1290" class="line"/>
  <path d="M420 1230 V1320 H660 V1225" class="dashed"/><text x="540" y="1360" text-anchor="middle" class="small">Changes requested return to form and review</text>
  <text x="90" y="1400" class="small">Renewals enter through pre-populated prior-year data and join the same quote-to-bind path after submission.</text>

  <rect x="50" y="1465" width="1400" height="330" class="panel"/><text x="80" y="1505" class="title">4. Use cases and actors</text>
  <rect x="90" y="1570" width="170" height="65" class="actor"/><text x="175" y="1600" text-anchor="middle" class="label">Member / client</text><text x="175" y="1622" text-anchor="middle" class="small">submit and respond</text>
  <rect x="320" y="1570" width="170" height="65" class="actor"/><text x="405" y="1600" text-anchor="middle" class="label">Handler</text><text x="405" y="1622" text-anchor="middle" class="small">manage pipeline</text>
  <rect x="550" y="1570" width="170" height="65" class="actor"/><text x="635" y="1600" text-anchor="middle" class="label">Underwriter</text><text x="635" y="1622" text-anchor="middle" class="small">rate and approve</text>
  <rect x="780" y="1570" width="170" height="65" class="actor"/><text x="865" y="1600" text-anchor="middle" class="label">Finance</text><text x="865" y="1622" text-anchor="middle" class="small">payments and rebates</text>
  <rect x="1010" y="1570" width="170" height="65" class="actor"/><text x="1095" y="1600" text-anchor="middle" class="label">Management</text><text x="1095" y="1622" text-anchor="middle" class="small">reports and board pack</text>
  <rect x="1240" y="1570" width="170" height="65" class="service"/><text x="1325" y="1600" text-anchor="middle" class="label">Platform</text><text x="1325" y="1622" text-anchor="middle" class="small">automate and audit</text>
  <path d="M260 1602 H320" class="line"/><path d="M490 1602 H550" class="line"/><path d="M720 1602 H780" class="line"/><path d="M950 1602 H1010" class="line"/><path d="M1180 1602 H1240" class="line"/>
  <text x="90" y="1720" class="small">Platform use cases: import master data, identify renewals, send campaigns, validate forms, rate proposals, bind policies, close monthly registers, reconcile finance, calculate rebates and publish insights.</text>

  <rect x="50" y="1825" width="1400" height="600" class="panel"/><text x="80" y="1865" class="title">5. Operational swimlane</text>
  <line x1="300" y1="1900" x2="300" y2="2375" stroke="#b8c8d6" stroke-width="2"/><line x1="530" y1="1900" x2="530" y2="2375" stroke="#b8c8d6" stroke-width="2"/><line x1="780" y1="1900" x2="780" y2="2375" stroke="#b8c8d6" stroke-width="2"/><line x1="1030" y1="1900" x2="1030" y2="2375" stroke="#b8c8d6" stroke-width="2"/><line x1="1260" y1="1900" x2="1260" y2="2375" stroke="#b8c8d6" stroke-width="2"/>
  <text x="175" y="1918" text-anchor="middle" class="label">Client</text><text x="415" y="1918" text-anchor="middle" class="label">Platform</text><text x="655" y="1918" text-anchor="middle" class="label">Handler</text><text x="905" y="1918" text-anchor="middle" class="label">Underwriter</text><text x="1145" y="1918" text-anchor="middle" class="label">Finance</text><text x="1370" y="1918" text-anchor="middle" class="label">Management</text>
  <text x="75" y="1965" class="small">Submit form</text><path d="M220 1975 H415" class="line"/><text x="315" y="1962" class="small">Validate and save</text><path d="M530 2010 H655" class="line"/><text x="545" y="2000" class="small">Create task</text><path d="M735 2045 H905" class="line"/><text x="750" y="2035" class="small">Review and rate</text><path d="M985 2080 H415" class="line"/><text x="770" y="2070" class="small">Save quote and audit</text><path d="M530 2115 H175" class="line"/><text x="250" y="2105" class="small">Send secure response</text><path d="M220 2150 H415" class="line"/><text x="245" y="2140" class="small">Accept / decline</text><path d="M530 2185 H905" class="line"/><text x="650" y="2175" class="small">Bind approval</text><path d="M985 2220 H1145" class="line"/><text x="1010" y="2210" class="small">Create ledger</text><path d="M1220 2255 H1370" class="line"/><text x="1240" y="2245" class="small">KPI event</text><path d="M1370 2290 H415" class="line"/><text x="800" y="2280" class="small">Reports, registers and board pack</text><text x="75" y="2350" class="small">Every action updates the Master Record; standalone rebates remain independent but feed management reporting.</text>
+</svg>