name: Deploy Buildwise (Neon + BigQuery + Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend — migrate Neon, verify BigQuery, deploy to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yardlogic-app/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yardlogic-app/backend/package-lock.json

      - name: Validate required deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_REGION: ${{ secrets.BIGQUERY_REGION }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_BACKEND_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL JWT_SECRET GCP_SERVICE_ACCOUNT_KEY GOOGLE_CLOUD_PROJECT_ID GCS_BUCKET BIGQUERY_DATASET BIGQUERY_REGION VERCEL_TOKEN VERCEL_ORG_ID VERCEL_BACKEND_PROJECT_ID VERCEL_FRONTEND_PROJECT_ID VITE_API_URL GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GMAIL_FROM_EMAIL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done
          echo "Required deployment secrets are present."

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      # Safe fallback for DBs created manually before Prisma migrations were
      # introduced. This baselines the existing schema once and then continues
      # with normal deploy behavior for future changes.
      - name: Apply Prisma migrations to Neon (non-destructive)
        run: |
          if ! npx prisma migrate deploy; then
            echo "Recovering the known failed AI wallet migration before retrying..."
            npx prisma migrate resolve --rolled-back 20260902052000_add_ai_wallet
            npx prisma migrate deploy
          fi

      - name: Clean stale Vercel config
        run: rm -rf .vercel

      # Non-destructive: the schema uses CREATE IF NOT EXISTS throughout,
      # so deploying it creates missing tables without dropping data.
      - name: Apply complete BigQuery schema
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_REGION: ${{ secrets.BIGQUERY_REGION }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
          trap 'rm -f /tmp/gcp-key.json /tmp/bigquery-schema.sql' EXIT
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          gcloud config set project "$GOOGLE_CLOUD_PROJECT_ID"

          if ! bq show --dataset "${GOOGLE_CLOUD_PROJECT_ID}:${BIGQUERY_DATASET}" > /dev/null 2>&1; then
            bq mk --dataset --location="$BIGQUERY_REGION" "${GOOGLE_CLOUD_PROJECT_ID}:${BIGQUERY_DATASET}"
          fi

          # The schema file is one directory above this job's working directory.
          # Remove its standalone CREATE SCHEMA statement because the dataset
          # above is authoritative for location and already exists by this point.
          sed \
            -e "s/YOUR_PROJECT\\.khatabook/${GOOGLE_CLOUD_PROJECT_ID}.${BIGQUERY_DATASET}/g" \
            -e '/^CREATE SCHEMA IF NOT EXISTS/d' \
            -e "/^OPTIONS (location = 'US');/d" \
            ../bigquery/schema.sql > /tmp/bigquery-schema.sql

          bq query \
            --project_id="$GOOGLE_CLOUD_PROJECT_ID" \
            --location="$BIGQUERY_REGION" \
            --use_legacy_sql=false < /tmp/bigquery-schema.sql

      - name: Build
        run: npm run build

      - name: Clean stale Vercel config
        run: rm -rf .vercel

      - name: Deploy backend to Vercel
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}" --project="${{ secrets.VERCEL_BACKEND_PROJECT_ID }}"

  frontend:
    name: Frontend — build & deploy to Vercel
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: yardlogic-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: yardlogic-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_COMPANY_NAME: ${{ secrets.VITE_COMPANY_NAME }}
          VITE_PRODUCT_NAME: ${{ secrets.VITE_PRODUCT_NAME }}
          VITE_GCS_BUCKET: ${{ secrets.VITE_GCS_BUCKET }}
          VITE_GCP_PROJECT_ID: ${{ secrets.VITE_GCP_PROJECT_ID }}
        run: npm run build

      - name: Clean stale Vercel config
        run: rm -rf .vercel

      - name: Deploy frontend to Vercel
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_ORG_ID }}" --project="${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}"
