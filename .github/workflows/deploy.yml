name: Deploy Buildwise (Neon + BigQuery + Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend — migrate Neon, verify BigQuery, deploy to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yardlogic-app/backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yardlogic-app/backend/package-lock.json

      - name: Validate required deployment secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_REGION: ${{ secrets.BIGQUERY_REGION }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_BACKEND_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          VERCEL_FRONTEND_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          VERTEX_AI_ENABLE: ${{ secrets.VERTEX_AI_ENABLE }}
          VERTEX_AI_LOCATION: ${{ secrets.VERTEX_AI_LOCATION }}
          VERTEX_AI_MODEL_ID: ${{ secrets.VERTEX_AI_MODEL_ID }}
          GEMINI_MODEL_ID: ${{ secrets.GEMINI_MODEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}
          GSP_API_KEY: ${{ secrets.GSP_API_KEY }}
          GSP_BASE_URL: ${{ secrets.GSP_BASE_URL }}
          PAYMENT_GATEWAY_KEY_ID: ${{ secrets.PAYMENT_GATEWAY_KEY_ID }}
          PAYMENT_GATEWAY_KEY_SECRET: ${{ secrets.PAYMENT_GATEWAY_KEY_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_SENDER_ID: ${{ secrets.MSG91_SENDER_ID }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL JWT_SECRET GCP_SERVICE_ACCOUNT_KEY GOOGLE_CLOUD_PROJECT_ID GCS_BUCKET BIGQUERY_DATASET BIGQUERY_REGION VERCEL_TOKEN VERCEL_ORG_ID VERCEL_BACKEND_PROJECT_ID VERCEL_FRONTEND_PROJECT_ID CORS_ORIGINS VERTEX_AI_ENABLE VERTEX_AI_LOCATION VERTEX_AI_MODEL_ID GMAIL_CLIENT_ID GMAIL_CLIENT_SECRET GMAIL_REFRESH_TOKEN GMAIL_FROM_EMAIL META_WHATSAPP_VERIFY_TOKEN META_WHATSAPP_ACCESS_TOKEN META_WHATSAPP_PHONE_NUMBER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done
          echo "Required deployment secrets are present."

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Apply Prisma migrations
        env:
          PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK: "1"
        run: |
          set -euo pipefail
          # Neon pooled connections can hold Prisma's migration advisory lock
          # long enough to time out. Use the direct hostname for migrations.
          migration_database_url="${DATABASE_URL/-pooler/}"
          DATABASE_URL="$migration_database_url" npx prisma migrate deploy

      - name: Clean stale Vercel config
        run: rm -rf .vercel

      # Non-destructive: the schema uses CREATE IF NOT EXISTS throughout,
      # so deploying it creates missing tables without dropping data.
      - name: Apply complete BigQuery schema
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_REGION: ${{ secrets.BIGQUERY_REGION }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-key.json
          trap 'rm -f /tmp/gcp-key.json /tmp/bigquery-schema.sql' EXIT
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json

          if ! bq show --dataset "${GOOGLE_CLOUD_PROJECT_ID}:${BIGQUERY_DATASET}" > /dev/null 2>&1; then
            bq mk --dataset --location="$BIGQUERY_REGION" "${GOOGLE_CLOUD_PROJECT_ID}:${BIGQUERY_DATASET}"
          fi

          # The schema file is one directory above this job's working directory.
          # Remove its standalone CREATE SCHEMA statement because the dataset
          # above is authoritative for location and already exists by this point.
          sed \
            -e "s/YOUR_PROJECT\\.khatabook/${GOOGLE_CLOUD_PROJECT_ID}.${BIGQUERY_DATASET}/g" \
            -e '/^CREATE SCHEMA IF NOT EXISTS/d' \
            -e "/^OPTIONS (location = 'US');/d" \
            ../bigquery/schema.sql > /tmp/bigquery-schema.sql

          bq query \
            --project_id="$GOOGLE_CLOUD_PROJECT_ID" \
            --location="$BIGQUERY_REGION" \
            --use_legacy_sql=false < /tmp/bigquery-schema.sql

          sed \
            -e "s/YOUR_PROJECT\\.khatabook/${GOOGLE_CLOUD_PROJECT_ID}.${BIGQUERY_DATASET}/g" \
            ../bigquery/migrations/20260902130000_add_financial_and_ai_metadata.sql > /tmp/bigquery-migration.sql

          bq query \
            --project_id="$GOOGLE_CLOUD_PROJECT_ID" \
            --location="$BIGQUERY_REGION" \
            --use_legacy_sql=false < /tmp/bigquery-migration.sql

      - name: Build
        run: npm run build

      - name: Clean stale Vercel config
        run: rm -rf .vercel

      - name: Deploy backend to Vercel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PRODUCT_NAME: ${{ secrets.PRODUCT_NAME }}
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_REGION: ${{ secrets.BIGQUERY_REGION }}
          VERTEX_AI_ENABLE: ${{ secrets.VERTEX_AI_ENABLE }}
          VERTEX_AI_LOCATION: ${{ secrets.VERTEX_AI_LOCATION }}
          VERTEX_AI_MODEL_ID: ${{ secrets.VERTEX_AI_MODEL_ID }}
          GEMINI_MODEL_ID: ${{ secrets.GEMINI_MODEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_AI_SUBSCRIPTION_REQUIRED: ${{ secrets.VERTEX_AI_SUBSCRIPTION_REQUIRED }}
          AI_DAILY_FREE_TOKENS: ${{ secrets.AI_DAILY_FREE_TOKENS }}
          AI_DAILY_FREE_CHATS: ${{ secrets.AI_DAILY_FREE_CHATS }}
          AI_COST_ASK: ${{ secrets.AI_COST_ASK }}
          AI_COST_CATEGORIZE_EXPENSE: ${{ secrets.AI_COST_CATEGORIZE_EXPENSE }}
          AI_COST_GENERATE_REPORT: ${{ secrets.AI_COST_GENERATE_REPORT }}
          AI_COST_INVOICE_INSIGHTS: ${{ secrets.AI_COST_INVOICE_INSIGHTS }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
          META_WHATSAPP_VERIFY_TOKEN: ${{ secrets.META_WHATSAPP_VERIFY_TOKEN }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}
          META_WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.META_WHATSAPP_PHONE_NUMBER_ID }}
          GSP_API_KEY: ${{ secrets.GSP_API_KEY }}
          GSP_BASE_URL: ${{ secrets.GSP_BASE_URL }}
          PAYMENT_GATEWAY_KEY_ID: ${{ secrets.PAYMENT_GATEWAY_KEY_ID }}
          PAYMENT_GATEWAY_KEY_SECRET: ${{ secrets.PAYMENT_GATEWAY_KEY_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          MSG91_AUTH_KEY: ${{ secrets.MSG91_AUTH_KEY }}
          MSG91_SENDER_ID: ${{ secrets.MSG91_SENDER_ID }}
          MSG91_TEMPLATE_ID: ${{ secrets.MSG91_TEMPLATE_ID }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          deployment_output_file="$(mktemp)"
          trap 'rm -f "$deployment_output_file"' EXIT
          npx vercel@latest deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.VERCEL_ORG_ID }}" \
            --project="${{ secrets.VERCEL_BACKEND_PROJECT_ID }}" \
            --env "DATABASE_URL=$DATABASE_URL" \
            --env "JWT_SECRET=$JWT_SECRET" \
            --env "NODE_ENV=production" \
            --env "PRODUCT_NAME=$PRODUCT_NAME" \
            --env "GOOGLE_CLOUD_PROJECT_ID=$GOOGLE_CLOUD_PROJECT_ID" \
            --env "GCP_SERVICE_ACCOUNT_KEY=$GCP_SERVICE_ACCOUNT_KEY" \
            --env "GCS_BUCKET=$GCS_BUCKET" \
            --env "BIGQUERY_DATASET=$BIGQUERY_DATASET" \
            --env "BIGQUERY_REGION=$BIGQUERY_REGION" \
            --env "VERTEX_AI_ENABLE=$VERTEX_AI_ENABLE" \
            --env "VERTEX_AI_LOCATION=$VERTEX_AI_LOCATION" \
            --env "VERTEX_AI_MODEL_ID=$VERTEX_AI_MODEL_ID" \
            --env "GEMINI_MODEL_ID=$GEMINI_MODEL_ID" \
            --env "GEMINI_API_KEY=$GEMINI_API_KEY" \
            --env "VERTEX_AI_SUBSCRIPTION_REQUIRED=$VERTEX_AI_SUBSCRIPTION_REQUIRED" \
            --env "AI_DAILY_FREE_TOKENS=$AI_DAILY_FREE_TOKENS" \
            --env "AI_DAILY_FREE_CHATS=$AI_DAILY_FREE_CHATS" \
            --env "AI_COST_ASK=$AI_COST_ASK" \
            --env "AI_COST_CATEGORIZE_EXPENSE=$AI_COST_CATEGORIZE_EXPENSE" \
            --env "AI_COST_GENERATE_REPORT=$AI_COST_GENERATE_REPORT" \
            --env "AI_COST_INVOICE_INSIGHTS=$AI_COST_INVOICE_INSIGHTS" \
            --env "GMAIL_CLIENT_ID=$GMAIL_CLIENT_ID" \
            --env "GMAIL_CLIENT_SECRET=$GMAIL_CLIENT_SECRET" \
            --env "GMAIL_REFRESH_TOKEN=$GMAIL_REFRESH_TOKEN" \
            --env "GMAIL_FROM_EMAIL=$GMAIL_FROM_EMAIL" \
            --env "META_WHATSAPP_VERIFY_TOKEN=$META_WHATSAPP_VERIFY_TOKEN" \
            --env "META_WHATSAPP_ACCESS_TOKEN=$META_WHATSAPP_ACCESS_TOKEN" \
            --env "META_WHATSAPP_PHONE_NUMBER_ID=$META_WHATSAPP_PHONE_NUMBER_ID" \
            --env "GSP_API_KEY=$GSP_API_KEY" \
            --env "GSP_BASE_URL=$GSP_BASE_URL" \
            --env "PAYMENT_GATEWAY_KEY_ID=$PAYMENT_GATEWAY_KEY_ID" \
            --env "PAYMENT_GATEWAY_KEY_SECRET=$PAYMENT_GATEWAY_KEY_SECRET" \
            --env "TWILIO_ACCOUNT_SID=$TWILIO_ACCOUNT_SID" \
            --env "TWILIO_AUTH_TOKEN=$TWILIO_AUTH_TOKEN" \
            --env "TWILIO_FROM_NUMBER=$TWILIO_FROM_NUMBER" \
            --env "MSG91_AUTH_KEY=$MSG91_AUTH_KEY" \
            --env "MSG91_SENDER_ID=$MSG91_SENDER_ID" \
            --env "MSG91_TEMPLATE_ID=$MSG91_TEMPLATE_ID" \
            --env "CORS_ORIGINS=$CORS_ORIGINS" 2>&1 | tee "$deployment_output_file"
          backend_deployment_url="$( { grep -E '^[[:space:]]*Production[[:space:]]+https://' "$deployment_output_file" || true; } | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | tail -n 1 | sed 's:/$::')"
          if [ -z "$backend_deployment_url" ]; then
            echo "Could not find the backend Production URL in Vercel output."
            exit 1
          fi
          echo "Backend deployment created: $backend_deployment_url"
          echo "BACKEND_DEPLOYMENT_URL=$backend_deployment_url" >> "$GITHUB_ENV"

      - name: Check deployed backend health
        run: |
          set -euo pipefail
          health_url="https://${BACKEND_DEPLOYMENT_URL#https://}/health"
          response="$(npx vercel@latest curl \
            --yes \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --scope "${{ secrets.VERCEL_ORG_ID }}" \
            "$health_url")" || {
            echo "Backend health request failed: $health_url"
            exit 1
          }
          if ! printf '%s' "$response" | jq -e '.ok == true' > /dev/null; then
            echo "Backend health response was not {\"ok\":true}: $response"
            exit 1
          fi
          echo "Backend health check passed: $health_url"

  frontend:
    name: Frontend — build & deploy to Vercel
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: yardlogic-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: yardlogic-app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        env:
          VITE_API_URL: https://yardlogic-backend.vercel.app
          VITE_COMPANY_NAME: ${{ secrets.VITE_COMPANY_NAME }}
          VITE_PRODUCT_NAME: ${{ secrets.VITE_PRODUCT_NAME }}
          VITE_GCS_BUCKET: ${{ secrets.VITE_GCS_BUCKET }}
          VITE_GCP_PROJECT_ID: ${{ secrets.VITE_GCP_PROJECT_ID }}
        run: npm run build

      - name: Clean stale Vercel config
        run: rm -rf .vercel

      - name: Deploy frontend to Vercel
        run: |
          npx vercel@latest deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --scope="${{ secrets.VERCEL_ORG_ID }}" \
            --project="${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}" \
            --build-env "VITE_API_URL=https://yardlogic-backend.vercel.app" \
            --build-env "VITE_COMPANY_NAME=${{ secrets.VITE_COMPANY_NAME }}" \
            --build-env "VITE_PRODUCT_NAME=${{ secrets.VITE_PRODUCT_NAME }}" \
            --build-env "VITE_GCS_BUCKET=${{ secrets.VITE_GCS_BUCKET }}" \
            --build-env "VITE_GCP_PROJECT_ID=${{ secrets.VITE_GCP_PROJECT_ID }}"

